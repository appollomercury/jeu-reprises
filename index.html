<head>

<title>Qui a chanté l’original ? (Sonos)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&display=swap">
<style>
:root{--bg:#17283A;--panel:#20374D;--ink:#F3F6FA;--mute:#9FB3C8;--hot:#FF6F91;--gold:#FFD166;--ok:#4FD1A5;--bad:#FF6F6F}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2rem;line-height:1.1;margin:8px 0 6px;font-weight:800}
p{color:var(--mute);line-height:1.5;margin:6px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;color:var(--ink)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cta{background:var(--hot);padding:14px 22px;font-weight:700;font-size:1.05rem;margin-top:16px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--mute)}
.top b{color:var(--gold)}
.bar{height:6px;background:var(--panel);border-radius:3px;margin:10px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left}
.disc{width:min(62vw,250px);aspect-ratio:1;margin:8px auto 18px;border-radius:50%;position:relative;
 background:repeating-radial-gradient(circle,#0c1218 0 3px,#162029 3px 5px);box-shadow:0 10px 30px #0006}
.disc.spin{animation:spin 2.4s linear infinite}
.disc .lab{position:absolute;inset:31%;border-radius:50%;background:var(--hot) center/cover no-repeat;display:grid;place-items:center;font-size:2rem}
.disc .lab::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.choices{display:grid;gap:10px}
.choices button{background:var(--panel);padding:15px;text-align:left;font-weight:700;font-size:1.02rem;border:2px solid transparent}
.choices button:hover:not(:disabled){border-color:var(--mute)}
.choices .ok{background:#1d5a49;border-color:var(--ok)}
.choices .no{background:#5a2a33;border-color:var(--bad)}
.q{text-align:center;font-weight:700;margin:0 0 14px}
.reveal{background:var(--panel);border-radius:14px;padding:14px;margin-top:14px;line-height:1.45}
.reveal strong{color:var(--gold)}
.big{font-size:3.4rem;font-weight:800;color:var(--gold);text-align:center;margin:10px 0}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.disc.spin{animation:none}}
select,input{width:100%;font:inherit;padding:13px;border-radius:12px;border:2px solid var(--panel);background:var(--bg);color:var(--ink);margin:8px 0}
.sm{background:var(--panel);padding:10px 14px;font-weight:700;margin-top:6px}
code{background:var(--panel);padding:2px 6px;border-radius:6px;word-break:break-all}
ol{color:var(--mute);line-height:1.6;padding-left:20px}
.step{background:var(--panel);border-radius:14px;padding:14px;margin:12px 0}
.step h2{font-size:1.05rem;margin:0 0 6px}
a.lk{display:block;background:var(--hot);color:var(--ink);text-decoration:none;font-weight:700;text-align:center;border-radius:12px;padding:12px;margin:10px 0}
a.lk.alt{background:var(--bg);border:2px solid var(--mute)}
.sv{width:100%;height:auto;margin-top:8px;border-radius:10px;background:var(--bg)}
.sv text{fill:var(--mute);font:12px "Bricolage Grotesque",system-ui,sans-serif}
.sv .hl{fill:none;stroke:var(--gold);stroke-width:3;rx:6}
.sv .box{fill:var(--panel);stroke:var(--mute);stroke-width:1;rx:6}
.sv .note{fill:var(--gold);font-weight:700}
.sv .no{fill:var(--bad);font-weight:700}
.ok-t{color:var(--ok);font-weight:700}
.cp{display:flex;gap:8px;align-items:center;margin:6px 0}
.cp code{flex:1}
.cp .sm{margin:0;white-space:nowrap}
.step ol{margin:6px 0}
.step li{margin:8px 0}
.step li b{color:var(--ink)}
.nav{display:flex;gap:10px;align-items:center;margin-top:20px}
.nav .cta{margin:0;flex:1}
.nav .sm{margin:0}
.hint{font-size:.9rem}
.bad{color:var(--bad);font-weight:700}
details.step summary{cursor:pointer}
</style>
</head>

const BUILTIN=SONGS.slice();
let GENRES=["Tous"];
const lget=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const keyOf=s=>s.t+"|"+s.c;
function refreshGenres(){GENRES=["Tous",...new Set(SONGS.map(s=>s.g))]}
function normSong(x){
 const f=(...k)=>{for(const a of k)if(x[a]!=null&&String(x[a]).trim())return String(x[a]).trim()};
 const t=f("t","titre","title"),c=f("c","reprise","reprise_par","cover"),o=f("o","original","original_par"),g=f("g","style","genre")||"Autres",ot=f("ot","titre_original","original_title");
 if(!t||!c||!o)return null;
 return ot?{t,c,o,g,ot}:{t,c,o,g};
}
function splitLine(l,d){
 const out=[];let c="",q=false;
 for(let k=0;k<l.length;k++){const ch=l[k];
  if(q){if(ch==='"'){if(l[k+1]==='"'){c+='"';k++}else q=false}else c+=ch}
  else if(ch==='"')q=true;
  else if(ch===d){out.push(c.trim());c=""}
  else c+=ch}
 out.push(c.trim());return out;
}
function parseList(txt){
 txt=txt.replace(/^\uFEFF/,"").trim();
 if(!txt)return [];
 if(txt[0]==="["||txt[0]==="{"){let a=JSON.parse(txt);if(!Array.isArray(a))a=a.songs||a.chansons||[];return a.map(normSong).filter(Boolean)}
 const lines=txt.split(/\r?\n/).filter(l=>l.trim()&&!l.trim().startsWith("#"));
 if(!lines.length)return [];
 const d=lines[0].includes(";")?";":",";
 let rows=lines.map(l=>splitLine(l,d));
 if(/^(titre|title|t)$/i.test(rows[0][0]))rows=rows.slice(1);
 return rows.map(r=>normSong({t:r[0],c:r[1],o:r[2],g:r[3],ot:r[4]})).filter(Boolean);
}
async function loadList(){
 let base=BUILTIN.slice(),src="intégrée";
 for(const f of ["chansons.csv","chansons.json"]){
  try{const r=await fetch(f,{cache:"no-store"});if(r.ok){const a=parseList(await r.text());if(a.length){base=a;src=f+" (hébergé avec le jeu)";break}}}catch(e){}
 }
 try{const m=JSON.parse(lget("mylist")||"null");if(m&&m.length){base=m;src="importée sur cet appareil"}}catch(e){}
 SONGS=base;window.LIST_SRC=src;refreshGenres();
}
/* Tirage aléatoire : évite les chansons déjà jouées récemment et varie les styles */
function pickDeck(pool,n){
 let played=[];try{played=JSON.parse(lget("played")||"[]")}catch(e){}
 const fresh=shuffle(pool.filter(s=>!played.includes(keyOf(s))));
 const rest=shuffle(pool.filter(s=>played.includes(keyOf(s))));
 let src=fresh;
 if(fresh.length<n){played=played.filter(k=>!pool.some(s=>keyOf(s)===k));src=[...fresh,...rest]}
 const by={};src.forEach(s=>(by[s.g]=by[s.g]||[]).push(s));
 const gs=shuffle(Object.keys(by));let out=[];
 while(out.length<n&&out.length<src.length){for(const g of gs){if(by[g].length&&out.length<n)out.push(by[g].shift())}}
 out=shuffle(out);
 played.push(...out.map(keyOf));lset("played",JSON.stringify(played.slice(-300)));
 return out;
}
function listPanel(){
 const fl=window.FLASH||"";window.FLASH="";
 return `<details class="step"${fl?" open":""}><summary><b>Ma liste de chansons</b></summary>
 <p>Liste actuelle : ${window.LIST_SRC} (${SONGS.length} chansons).</p>
 <p>Un fichier .csv, une chanson par ligne :</p>
 <code>titre;reprise par;original par;style;titre de l’original (facultatif)</code>
 <p class="hint">Astuce : dépose un fichier <b>chansons.csv</b> à côté de index.html dans GitHub, et le jeu le charge tout seul sur tous tes appareils.</p>
 <select id="lmode"><option value="add">Ajouter à la liste actuelle</option><option value="rep">Remplacer la liste actuelle</option></select>
 <label class="sm" style="display:block;text-align:center;cursor:pointer;border:2px solid var(--mute)">Importer un fichier (.csv ou .json)<input id="lfile" type="file" accept=".csv,.json,.txt" hidden></label>
 <button class="sm" id="lexp">Exporter la liste actuelle (modèle à modifier)</button>
 <button class="sm" id="lrst">Retirer ma liste importée</button>
 <button class="sm" id="lhist">Oublier les chansons déjà jouées</button>
 <p id="lmsg" class="hint">${fl}</p></details>`;
}
function bindListPanel(rerender){
 const msg=t=>{document.getElementById("lmsg").textContent=t};
 document.getElementById("lfile").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
   const a=parseList(await f.text());
   if(!a.length){msg("Aucune chanson valide trouvée dans ce fichier.");return}
   let list=document.getElementById("lmode").value==="add"?[...SONGS,...a]:a;
   const seen=new Set();list=list.filter(s=>{const k=keyOf(s);if(seen.has(k))return false;seen.add(k);return true});
   lset("mylist",JSON.stringify(list));
   await loadList();window.FLASH=a.length+" chanson(s) lues. La liste compte maintenant "+SONGS.length+" chansons.";rerender();
  }catch(err){msg("Fichier illisible : "+err.message)}
 };
 document.getElementById("lexp").onclick=()=>{
  const q=v=>/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
  const rows=["titre;reprise_par;original_par;style;titre_original",...SONGS.map(s=>[s.t,s.c,s.o,s.g,s.ot||""].map(q).join(";"))];
  const b=new Blob(["\uFEFF"+rows.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="chansons.csv";document.body.appendChild(a);a.click();a.remove();
  msg("Fichier chansons.csv téléchargé.");
 };
 document.getElementById("lrst").onclick=async()=>{try{localStorage.removeItem("mylist")}catch(e){}await loadList();window.FLASH="Liste importée retirée.";rerender()};
 document.getElementById("lhist").onclick=()=>{try{localStorage.removeItem("played")}catch(e){}msg("Historique effacé : toutes les chansons peuvent revenir.")};
}

let ROUNDS=10;const TIME=20,app=document.getElementById("app");
const LS=k=>localStorage.getItem(k),SS=(k,v)=>localStorage.setItem(k,v);
const REDIRECT=location.origin+location.pathname;
let deck,i,score,streak,best,timer,left,cur,locked,devId;
const shuffle=a=>{a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const n=x=>x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");

/* ---------- Spotify ---------- */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function login(){
 const id=document.getElementById("cid").value.replace(/\s/g,"");
 const er=document.getElementById("cer");
 if(!location.protocol.startsWith("http")){er.textContent="La page doit être ouverte depuis son adresse web (https://…), pas depuis un fichier téléchargé.";return}
 if(!/^[a-f0-9]{32}$/i.test(id)){er.textContent="Le Client ID contient exactement 32 caractères (lettres a-f et chiffres). Vérifie que tu n’as pas copié le Client Secret ou le nom de l’application.";return}
 SS("cid",id);
 const v=b64(crypto.getRandomValues(new Uint8Array(48)));SS("ver",v);
 const ch=b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
 location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({client_id:id,response_type:"code",redirect_uri:REDIRECT,scope:"user-modify-playback-state user-read-playback-state",code_challenge_method:"S256",code_challenge:ch});
}
async function tokenReq(p){
 const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:LS("cid"),...p})});
 const d=await r.json();
 if(!d.access_token)throw new Error("connexion Spotify refusée");
 SS("tok",d.access_token);SS("exp",Date.now()+d.expires_in*1000-60000);
 if(d.refresh_token)SS("ref",d.refresh_token);
}
async function token(){
 if(Date.now()>+LS("exp"))await tokenReq({grant_type:"refresh_token",refresh_token:LS("ref")});
 return LS("tok");
}
async function api(path,opt={}){
 const r=await fetch("https://api.spotify.com/v1"+path,{...opt,headers:{Authorization:"Bearer "+await token(),"Content-Type":"application/json"}});
 if(r.status===204||r.status===202)return null;
 const d=await r.json().catch(()=>null);
 if(!r.ok)throw new Error(r.status===404?"appareil inactif : lance une chanson sur la Sonos depuis l’appli Spotify, puis réessaie":r.status===403?"Spotify Premium requis ou accès refusé":(d&&d.error&&d.error.message)||"erreur "+r.status);
 return d;
}
async function findTrack(t,who){
 const d=await api("/search?type=track&limit=10&q="+encodeURIComponent(`track:${t} artist:${who}`));
 const a=n(who).replace(/^the/,""),items=d.tracks.items;
 const hit=items.find(x=>x.artists.some(y=>n(y.name).includes(a)||a.includes(n(y.name))))||items[0];
 if(!hit)throw new Error("titre introuvable sur Spotify");
 return hit;
}
const dq=()=>devId&&devId!=="active"?"?device_id="+devId:"";
const playTrack=h=>api("/me/player/play"+dq(),{method:"PUT",body:JSON.stringify({uris:[h.uri],position_ms:Math.floor(h.duration_ms*0.3)})});
const stop=()=>api("/me/player/pause"+dq(),{method:"PUT"}).catch(()=>{});
const art=h=>{const u=h.album&&h.album.images[0];if(u){const l=document.getElementById("lab");l.style.backgroundImage=`url(${u.url})`;l.textContent=""}};

/* ---------- Écrans ---------- */
function cpy(t){return `<div class="cp"><code>${t}</code><button class="sm" data-c="${t}">Copier</button></div>`}
const lnk=(u,t,alt)=>`<a class="lk${alt?" alt":""}" href="${u}" target="_blank" rel="noopener">${t}</a>`;
const BACK="<p class=\"hint\">Reviens ici avec le sélecteur d’onglets de ton navigateur.</p>";
const STEPS=[
 {t:"Créer ton dossier GitHub",h:()=>`<p>Un « dépôt » est le dossier en ligne qui va héberger le jeu.</p>${lnk("https://github.com/new","Ouvrir GitHub")}<p>Dans « Repository name », écris :</p>${cpy("jeu-reprises")}<p>Choisis <b>Public</b>, puis touche <b>Create repository</b>.</p>${BACK}`},
 {t:"Déposer le fichier index.html",h:()=>`<p>Sur la page de ton nouveau dépôt, touche le lien <b>uploading an existing file</b>.</p><p>Choisis le fichier <b>index.html</b> (celui téléchargé depuis cette conversation), puis touche <b>Commit changes</b>.</p>${BACK}`},
 {t:"Activer la page en ligne",h:()=>`<p>Dans ton dépôt : onglet <b>Settings</b>, puis <b>Pages</b> (menu de gauche).</p><p>Sous « Branch », choisis <b>main</b> et <b>/ (root)</b>, puis touche <b>Save</b>.</p><p>Attends une minute et recharge : une adresse apparaît en haut (« Your site is live at… »).</p>${BACK}`},
 {t:"Ouvrir ton adresse en ligne",h:()=>`<p>Touche l’adresse qui s’affiche dans les réglages Pages : c’est cette même page, mais en ligne.</p><p>L’assistant reprendra à l’étape suivante.</p><p class="hint">Cette étape est la seule qui se fait hors du jeu.</p>`},
 {t:"Ouvrir Spotify pour développeurs",h:()=>`${lnk("https://developer.spotify.com/dashboard/create","Ouvrir la création d’application")}<p>Connecte-toi avec ton compte Spotify Premium et accepte les conditions si on te les propose.</p>${BACK}`},
 {t:"Nom et description",h:()=>`<p>Dans « App name » :</p>${cpy("Jeu des reprises")}<p>Dans « App description » :</p>${cpy("Jeu musical diffusé sur ma Sonos")}<p>Laisse « Website » vide.</p>${BACK}`},
 {t:"Adresse de retour (Redirect URI)",h:()=>`<p>Copie cette adresse, colle-la dans « Redirect URI », puis touche <b>Add</b> à côté de la case.</p>${location.protocol.startsWith("http")?cpy(REDIRECT):'<p class="bad">Ouvre d’abord la page depuis son adresse en ligne (étapes 1 à 4).</p>'}<p>Elle doit apparaître dans une liste sous la case.</p>${BACK}`},
 {t:"Web API et enregistrement",h:()=>`<p>Sous « Which API/SDKs are you planning to use? », coche <b>Web API</b>.</p><p>Coche la case des conditions, puis touche <b>Save</b>.</p>${BACK}`},
 {t:"Copier le Client ID",h:()=>`${lnk("https://developer.spotify.com/dashboard","Ouvrir mes applications Spotify")}<p>Touche « Jeu des reprises », puis <b>Settings</b>. Copie la ligne <b>Client ID</b> (32 caractères).</p><p class="bad">Ne copie pas « Client secret ».</p>${BACK}`},
 {t:"Coller le Client ID et se connecter",h:()=>`<input id="cid" placeholder="Client ID (32 caractères)" autocomplete="off" value="${LS("cid")||""}"><button class="sm" id="pa">Coller depuis le presse-papiers</button><p id="cer"></p><div id="mob"></div><button class="cta" id="lg">Se connecter à Spotify</button><p>Spotify demande l’autorisation : touche <b>Accepter</b>. Tu reviens ensuite dans le jeu.</p><p class="hint">Si une erreur s’affiche : INVALID_CLIENT = Client ID faux (étape 9) ; INVALID_REDIRECT_URI = adresse de l’étape 7 différente.</p>`}
];
function setup(){
 const web=location.protocol.startsWith("http");
 let k=+(LS("stp")||0);
 if(web&&k<4)k=4;
 k=Math.min(k,STEPS.length-1);
 const s=STEPS[k];
 app.innerHTML=`<div class="top"><span>Étape ${k+1} sur ${STEPS.length}</span><b>Installation Spotify</b></div>
 <div class="bar"><i style="transform:scaleX(${(k+1)/STEPS.length})"></i></div>
 <h1>${s.t}</h1>${s.h()}
 <div class="nav">${k>(web?4:0)?'<button class="sm" id="bk">← Retour</button>':'<span></span>'}${k<STEPS.length-1?'<button class="cta" id="nx2">C’est fait, suite →</button>':''}</div>`;
 const go=d=>{SS("stp",k+d);setup();scrollTo(0,0)};
 const b=document.getElementById("bk"),n2=document.getElementById("nx2");
 if(b)b.onclick=()=>go(-1);
 if(n2)n2.onclick=()=>go(1);
 document.querySelectorAll("[data-c]").forEach(x=>x.onclick=async()=>{try{await navigator.clipboard.writeText(x.dataset.c);x.textContent="Copié ✓"}catch(e){x.textContent="Copie à la main"}});
 const lg=document.getElementById("lg");
 if(lg){
  lg.onclick=login;
  const cid=document.getElementById("cid"),cer=document.getElementById("cer");
  cid.oninput=()=>{const v=cid.value.replace(/\s/g,""),ok=/^[a-f0-9]{32}$/i.test(v);cer.style.color=ok?"var(--ok)":"var(--bad)";cer.textContent=v?(ok?"Client ID valide ✓":"Il faut 32 caractères (chiffres et lettres a-f). Tu en as "+v.length+"."):"";const mob=document.getElementById("mob");mob.innerHTML=ok&&location.protocol.startsWith("http")?"<p>Pour terminer sur ton téléphone, copie ce lien et envoie-le-toi (message, courriel, notes) :</p>"+cpy(REDIRECT+"?cid="+v):"";const mb=mob.querySelector("[data-c]");if(mb)mb.onclick=async()=>{try{await navigator.clipboard.writeText(mb.dataset.c);mb.textContent="Copié ✓"}catch(e){mb.textContent="Copie à la main"}}};
  document.getElementById("pa").onclick=async()=>{try{cid.value=(await navigator.clipboard.readText()).trim();cid.oninput()}catch(e){cer.style.color="var(--bad)";cer.textContent="Colle-le à la main dans la case."}};
  if(cid.value)cid.oninput();
 }
}
async function home(){
 app.innerHTML=`<h1>Qui a chanté l’original ?</h1>
 <p>Tu entends une reprise sur ta Sonos. Devine qui a créé la chanson avant elle. À la fin de chaque manche, l’original joue.</p>
 <div class="disc"><div class="lab">🎵</div></div>
 <p>Style musical :</p><select id="gn">${GENRES.map(g=>`<option value="${g}">${g}</option>`).join("")}</select>
 <p>Enceinte de diffusion :</p>
 <select id="dev"></select>
 <button class="sm" id="rf">Actualiser la liste</button>
 <p id="msg"></p>
 <button class="cta" id="go">Lancer la partie</button>
 ${listPanel()}`;
 document.getElementById("rf").onclick=loadDevices;
 bindListPanel(home);
 document.getElementById("go").onclick=()=>{
  devId=document.getElementById("dev").value;
  if(!devId){document.getElementById("msg").textContent="Choisis d’abord une enceinte.";return}
  SS("dev",devId);const g=document.getElementById("gn").value;POOL=g==="Tous"?null:SONGS.filter(x=>x.g===g);start()};
 loadDevices();
}
async function loadDevices(){
 const sel=document.getElementById("dev"),msg=document.getElementById("msg");
 msg.textContent="Recherche des enceintes…";
 try{
  const d=await api("/me/player/devices");
  sel.innerHTML='<option value="active">Appareil actif de Spotify (garde la sortie en cours)</option>'+d.devices.map(x=>`<option value="${x.id}">${x.name} (${x.type})${x.is_active?" – actif":""}</option>`).join("");
  const pick=d.devices.find(x=>x.id===LS("dev"))||d.devices.find(x=>x.type==="Speaker");
  sel.value=pick?pick.id:"active";
  msg.textContent=d.devices.some(x=>x.type==="Speaker")?"":(d.devices.length?"Ta Sonos n’est pas encore visible, seulement : "+d.devices.map(x=>x.name).join(", ")+". Dans l’appli Spotify du téléphone ou de l’ordinateur (pas le lecteur web), choisis ta Sonos, joue une chanson 10 secondes, puis touche Actualiser.":"Aucune enceinte trouvée. Ouvre l’appli Spotify, joue une chanson sur la Sonos, puis touche Actualiser.");
 }catch(e){msg.textContent="Erreur : "+e.message}
}
function start(){const pool=POOL||SONGS;deck=pickDeck(pool,10);ROUNDS=deck.length;i=0;score=0;streak=0;round()}

async function round(){
 cur=deck[i];locked=false;
 const opts=shuffle([cur.o,...shuffle([...new Set([...SONGS,...BUILTIN].map(s=>s.o))].filter(o=>o!==cur.o)).slice(0,3)]);
 app.innerHTML=`<div class="top"><span>Manche ${i+1} / ${ROUNDS}</span><b>${score} pts</b></div>
 <div class="bar"><i id="bar"></i></div>
 <div class="disc" id="disc"><div class="lab" id="lab">🎵</div></div>
 <p class="q" id="q">Envoi vers la Sonos…</p>
 <div class="choices" id="ch"></div><div id="rev"></div>`;
 try{const h=await findTrack(cur.t,cur.c);await playTrack(h);art(h)}
 catch(e){document.getElementById("q").textContent="Lecture impossible ("+e.message+"). On passe à la suivante.";setTimeout(next,3500);return}
 document.getElementById("disc").classList.add("spin");
 document.getElementById("q").textContent="Qui a créé la chanson originale ?";
 const ch=document.getElementById("ch");
 opts.forEach(o=>{const b=document.createElement("button");b.textContent=o;b.onclick=()=>answer(b,o);ch.appendChild(b)});
 const t0=Date.now(),bar=document.getElementById("bar");
 clearInterval(timer);
 timer=setInterval(()=>{
  left=Math.max(0,TIME-(Date.now()-t0)/1000);
  bar.style.transform=`scaleX(${left/TIME})`;
  if(left<=0){clearInterval(timer);answer(null,null)}
 },100);
}
function answer(btn,choice){
 if(locked)return;locked=true;clearInterval(timer);
 document.getElementById("disc").classList.remove("spin");
 const good=choice===cur.o;let gain=0;
 if(good){streak++;gain=50+Math.round(left*5)+(streak>1?(streak-1)*10:0);score+=gain;best=Math.max(best||0,streak)}else streak=0;
 document.querySelectorAll("#ch button").forEach(b=>{b.disabled=true;if(b.textContent===cur.o)b.classList.add("ok");else if(b===btn)b.classList.add("no")});
 document.getElementById("rev").innerHTML=`<div class="reveal">${good?`Bravo, +${gain} pts${streak>1?` (série de ${streak})`:""}.`:(choice?"Raté.":"Temps écoulé.")}<br>
 <strong>${cur.t}</strong> a été créée par ${cur.o}. Cette version est de ${cur.c}.<br><span id="orig">Chargement de l’original…</span></div>
 <button class="cta" id="nx">${i+1<ROUNDS?"Manche suivante":"Voir mon score"}</button>`;
 document.getElementById("nx").onclick=next;
 playOriginal();
}
async function playOriginal(){
 const my=i,st=document.getElementById("orig");
 try{
  const h=await findTrack(cur.ot||cur.t,cur.o);
  if(my!==i)return;
  await playTrack(h);art(h);
  document.getElementById("disc").classList.add("spin");
  st.textContent="▶ L’original de "+cur.o+" joue sur ta Sonos.";
 }catch(e){if(my===i)st.textContent="Original impossible à lancer : "+e.message}
}
function next(){clearInterval(timer);stop();i++;i<deck.length?round():end()}
function end(){
 const msg=score>900?"Oreille d’expert.":score>500?"Belle culture musicale.":"À toi de rejouer pour t’améliorer.";
 app.innerHTML=`<h1>Partie terminée</h1><div class="big">${score} pts</div>
 <p style="text-align:center">${msg} Meilleure série : ${best||0}.</p><button class="cta" id="again">Rejouer</button>`;
 document.getElementById("again").onclick=start;
}
function connectScreen(){
 app.innerHTML=`<h1>Dernière étape</h1>
 <p>Le Client ID est déjà enregistré sur cet appareil. Touche le bouton, connecte-toi à Spotify et accepte l’autorisation : tu reviens ensuite dans le jeu.</p>
 <input id="cid" type="hidden" value="${LS("cid")}"><p id="cer" class="bad"></p>
 <button class="cta" id="lg">Se connecter à Spotify</button>
 <button class="sm" id="chg">Changer de Client ID</button>`;
 document.getElementById("lg").onclick=login;
 document.getElementById("chg").onclick=()=>{localStorage.removeItem("cid");SS("stp",9);setup()};
}
async function boot(){
 await loadList();
 const q=new URLSearchParams(location.search),code=q.get("code"),pc=(q.get("cid")||"").replace(/\s/g,"");
 if(/^[a-f0-9]{32}$/i.test(pc)){SS("cid",pc);history.replaceState({},"",REDIRECT)}
 if(code){
  try{await tokenReq({grant_type:"authorization_code",code,redirect_uri:REDIRECT,code_verifier:LS("ver")})}catch(e){}
  history.replaceState({},"",REDIRECT);
 }
 if(LS("ref"))home();else if(LS("cid")&&location.protocol.startsWith("http"))connectScreen();else setup();
}
boot();
</script>
</body>
</html>
